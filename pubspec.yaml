name: apk_auth
description: App de autenticação e notas com Flutter e Firebase, baseado nos materiais da aula.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  lottie: ^3.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/animations/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: '#0B1220'
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
